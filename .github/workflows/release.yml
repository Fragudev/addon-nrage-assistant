name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Stamp version into TOC
        run: sed -i "s/@project-version@/${GITHUB_REF_NAME}/g" NrageAssistant/NrageAssistant.toc

      - name: Build zip
        run: |
          zip -r "NrageAssistant-${GITHUB_REF_NAME}.zip" NrageAssistant \
            -x "*.DS_Store" "*/.git*"

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          prerelease=""
          if [[ "${GITHUB_REF_NAME}" == *-* ]]; then
            prerelease="--prerelease"
          fi
          gh release create "${GITHUB_REF_NAME}" "NrageAssistant-${GITHUB_REF_NAME}.zip" \
            --title "Nrage Assistant ${GITHUB_REF_NAME}" \
            --generate-notes $prerelease
