name: CI

on:
  pull_request:
  push:
    branches: [main, develop]
  workflow_call:
    inputs:
      ref:
        description: Git ref to test (defaults to the triggering commit)
        type: string
        default: ""

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  COVERAGE_MINIMUM: 80

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref }}

      - name: Set up Lua 5.1
        uses: leafo/gh-actions-lua@v13
        with:
          luaVersion: "5.1"

      - name: Set up LuaRocks
        uses: leafo/gh-actions-luarocks@v6

      - name: Install luacheck, busted and luacov
        # Some rocks (lua-term, a busted dependency) are fetched from GitHub archives, which the runner sometimes
        # fails to download. Each install is retried a few times; an installed rock is skipped on the next attempt.
        run: |
          for rock in luacheck busted luacov; do
            for attempt in 1 2 3; do
              if luarocks install "$rock"; then
                break
              fi
              if [[ "$attempt" == 3 ]]; then
                echo "::error::Could not install $rock after 3 attempts."
                exit 1
              fi
              echo "Installing $rock failed (attempt $attempt), retrying in 20 s."
              sleep 20
            done
          done

      - name: Lint
        run: luacheck NrageAssistant tests

      - name: Test
        run: busted --coverage

      - name: Coverage
        run: |
          luacov
          sed -n '/^Summary/,$p' luacov.report.out | sed '1,2d' | {
            echo '```'
            cat
            echo '```'
          } >>"$GITHUB_STEP_SUMMARY"
          tools/check_coverage.sh "$COVERAGE_MINIMUM"

  format:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref }}

      - name: Check formatting
        uses: JohnnyMorganz/stylua-action@v5
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          version: 2.5.2
          args: --check NrageAssistant tests

  package:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref }}

      - name: Build and verify the addon zip
        run: tools/package.sh "ci-${GITHUB_SHA::7}"
